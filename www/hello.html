<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        .tool {
            background: #fff;
            margin: 20px 0;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .tool h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>个人工具库</h1>
    </header>
    <div class="container">
        <div class="tool">
            <h2>Tool 1</h2>
            <p>Description of Tool 1.</p>
        </div>
        <div class="tool">
            <h2>Tool 2</h2>
            <p>Description of Tool 2.</p>
        </div>
        <div class="tool">
            <h2>Tool 3</h2>
            <p>Description of Tool 3.</p>
        </div>
    </div>
</body>
</html>
